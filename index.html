:root{--tablet-touch:58px;--tablet-radius:14px}
@media (min-width:700px) and (max-width:1400px){
body{font-size:18px}.app{grid-template-columns:210px minmax(0,1fr)}.sidebar{padding:16px 12px}.brand{font-size:22px}
.main{padding:0 16px 96px;max-width:none}.topbar{min-height:68px;padding:10px 18px}.topbar h1{font-size:22px}
.card{padding:18px;border-radius:var(--tablet-radius)}.workspace{grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.manager-grid{grid-template-columns:minmax(0,1fr) 350px;gap:16px}.option-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.quick-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.jobbar{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.btn,.option,.quick,.list .row,.simple-location-btn{min-height:var(--tablet-touch)}
.btn{font-size:17px;padding:13px 16px}.option{padding:18px}.option h3{font-size:20px}.list .row{padding:16px;font-size:18px}
.simple-location-grid{grid-template-columns:1fr 1fr;gap:16px}.simple-location-btn{min-height:105px}.simple-location-btn strong{font-size:23px}
.verifyhead,.verifyline{grid-template-columns:minmax(0,1fr) 70px 70px 70px}.verifychoice input,.checkrow input{width:26px;height:26px}
.field input,.field select,.field textarea{min-height:54px;font-size:18px;padding:12px}
.footer-actions{position:sticky;bottom:0;background:#eef3f8;padding:12px 0;z-index:25}.footer-actions .btn{min-width:140px}
.photo-preview{max-height:360px}.ro-photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.ro-photo-card img{height:180px}
.pinbox{width:min(760px,94vw)}.steps{padding:8px 4px}.step{font-size:14px}.step .n{width:36px;height:36px}
}
@media (min-width:700px) and (max-width:1000px) and (orientation:portrait){
.app{grid-template-columns:1fr}.sidebar{display:none}.main{max-width:900px;margin:0 auto;padding:0 14px 104px}
.topbar{margin:0 -14px 14px}.workspace,.manager-grid{grid-template-columns:1fr}.workspace>div.grid,.manager-grid>div.grid{margin-top:14px}
.quick-grid,.jobbar,.pricebar{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{position:sticky;top:68px;z-index:20;background:white}
.footer-actions{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line);padding:10px 14px}
.footer-actions>.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}.footer-actions .btn{width:100%;min-height:58px}
.ro-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1000px) and (max-width:1400px) and (orientation:landscape){
.app{grid-template-columns:220px minmax(0,1fr)}.workspace{grid-template-columns:minmax(0,1fr) 340px}
.quick-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.jobbar{grid-template-columns:repeat(6,minmax(0,1fr))}
.ro-photo-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.ro-photo-card img{height:165px}
}
html,body,#root,.app,.main{max-width:100%;overflow-x:hidden}img,canvas,video{max-width:100%;height:auto}.table{max-width:100%}

function srtMode(){return localStorage.getItem('jk_srt_mode')||'average'}
function setSrtMode(v){localStorage.setItem('jk_srt_mode',v);render()}
function srtEntryByIndex(i){i=Number(i);return Number.isInteger(i)&&i>=0?SRT_LIBRARY[i]:null}
function autoSrtIndex(r){
 const aliases=SRT_ALIASES[r.package]||[];
 const repair=(r.repair||'').toLowerCase(), system=(r.system||'').toLowerCase();
 for(const phrase of aliases){
   const idx=SRT_LIBRARY.findIndex(x=>x.description.toLowerCase().includes(phrase));
   if(idx>=0)return idx;
 }
 const words=[r.package,r.repair,r.system].filter(Boolean).join(' ').toLowerCase()
   .replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>2&&!['repair','replace','inspect','system'].includes(x));
 let best=-1,bestScore=0;
 SRT_LIBRARY.forEach((x,i)=>{
   const d=x.description.toLowerCase();
   let score=words.reduce((s,w)=>s+(d.includes(w)?1:0),0);
   if(repair&&d.includes(repair))score+=1;
   if(system&&d.includes(system))score+=.5;
   if(score>bestScore){best=i;bestScore=score}
 });
 return bestScore>=2?best:-1;
}
function srtIndexFor(r){return r.srtIndex!==undefined&&r.srtIndex!==null&&r.srtIndex!==''?Number(r.srtIndex):autoSrtIndex(r)}
function srtEntryFor(r){return srtEntryByIndex(srtIndexFor(r))}
function srtHours(r){
 const e=srtEntryFor(r); if(!e)return null;
 const mode=srtMode();
 const v=mode==='goal'?e.goal:e.average;
 return Number(v)>0?Number(v):(Number(e.average)>0?Number(e.average):Number(e.goal));
}
function setSrtOverride(i,v){
 const j=state.job||jobs()[0]; if(!j||!j.repairs[i])return;
 j.repairs[i].srtIndex=v===''?null:Number(v);
 j.repairs[i].estimateUsed=null;
 saveJobs(jobs().map(x=>x.id===j.id?j:x)); state.job=j; render();
}

const RO_PHOTO_DB='jk_ro_photos_db';
const RO_PHOTO_STORE='photos';
function openPhotoDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(RO_PHOTO_DB,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(RO_PHOTO_STORE)){
        const s=db.createObjectStore(RO_PHOTO_STORE,{keyPath:'id',autoIncrement:true});
        s.createIndex('ro','ro',{unique:false});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function addROPhotoRecord(record){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(RO_PHOTO_STORE,'readwrite');
    const req=tx.objectStore(RO_PHOTO_STORE).add(record);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function getROPhotos(ro){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(RO_PHOTO_STORE,'readonly');
    const req=tx.objectStore(RO_PHOTO_STORE).index('ro').getAll(ro);
    req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
    req.onerror=()=>reject(req.error);
  });
}
async function deleteROPhotoRecord(id){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(RO_PHOTO_STORE,'readwrite');
    const req=tx.objectStore(RO_PHOTO_STORE).delete(Number(id));
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
    r.readAsDataURL(file);
  });
}
function compressPhotoDataURL(dataUrl,maxW=1600,quality=.78){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*scale));
      c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=reject;
    img.src=dataUrl;
  });
}

async function saveROPhotoFromInput(e){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const status=document.getElementById('roPhotoUploadStatus');
  try{
    status.textContent='Preparing photo…';
    const raw=await fileToDataURL(file);
    const dataUrl=await compressPhotoDataURL(raw);
    await addROPhotoRecord({
      ro:state.job.id,
      trailer:state.job.trailer,
      type:document.getElementById('roPhotoType').value,
      note:(document.getElementById('roPhotoNote').value||'').trim(),
      techNo:state.user.id,
      createdAt:new Date().toISOString(),
      fileName:file.name,
      dataUrl
    });
    status.textContent='Photo saved to this tablet/browser.';
    document.getElementById('roPhotoNote').value='';
    e.target.value='';
    await refreshROPhotoGallery();
  }catch(err){
    console.error(err);
    status.textContent='Photo could not be saved. Try a smaller image or free browser storage.';
  }
}
async function refreshROPhotoGallery(){
  const gallery=document.getElementById('roPhotoGallery');
  if(!gallery||!state.job)return;
  const photos=await getROPhotos(state.job.id);
  document.getElementById('roPhotoCount').textContent=`${photos.length} photo${photos.length===1?'':'s'}`;
  gallery.innerHTML=photos.length?photos.map(p=>`<div class="ro-photo-card">
    <img src="${p.dataUrl}" alt="${escapeHtml(p.type)} photo">
    <div class="ro-photo-meta">
      <strong>${escapeHtml(p.type)}</strong>
      ${p.note?`<div>${escapeHtml(p.note)}</div>`:''}

      </div>
    </div>
  </div>`).join(''):'<div class="muted">No photos have been added to this repair order.</div>';
}
async function viewROPhoto(id){
  const photos=await getROPhotos(state.job.id);
  const p=photos.find(x=>Number(x.id)===Number(id));
  if(!p)return;

  document.body.appendChild(m);
}
async function removeROPhoto(id){
  if(!confirm('Delete this photo from the RO?'))return;
  await deleteROPhotoRecord(id);
  await refreshROPhotoGallery();
}

function drawScaledBitmap(bitmap,maxWidth=2200){
  const scale=Math.min(1,maxWidth/bitmap.width);
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));
  canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  return canvas;
}
function photoStats(canvas){
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const {data}=ctx.getImageData(0,0,canvas.width,canvas.height);
  let sum=0,sum2=0,dark=0,light=0,n=0;
  const stride=Math.max(4,Math.floor(data.length/180000/4)*4);
  for(let i=0;i<data.length;i+=stride){
    const g=.299*data[i]+.587*data[i+1]+.114*data[i+2];
    sum+=g;sum2+=g*g;n++;if(g<55)dark++;if(g>235)light++;
  }
  const mean=sum/n,sd=Math.sqrt(Math.max(0,sum2/n-mean*mean));
  return{mean,sd,darkPct:dark/n,lightPct:light/n};

function preprocessVariant(base,mode){
  const out=document.createElement('canvas');out.width=base.width;out.height=base.height;
  const ctx=out.getContext('2d',{willReadFrequently:true});ctx.drawImage(base,0,0);
  const img=ctx.getImageData(0,0,out.width,out.height),d=img.data;
  let sum=0,n=0;
  for(let i=0;i<d.length;i+=4){sum+=.299*d[i]+.587*d[i+1]+.114*d[i+2];n++}
  const mean=sum/n;
  for(let i=0;i<d.length;i+=4){
    const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];let v=g;
    if(mode==='balanced')v=(g-mean)*1.42+165;
    if(mode==='shadow'){
      const gamma=mean<150?.72:.88;
      v=255*Math.pow(g/255,gamma);
      v=(v-128)*1.35+150;
    }
    if(mode==='threshold'){
      const t=Math.max(125,Math.min(205,mean*.93));
      v=g>t?255:0;
    }
    d[i]=d[i+1]=d[i+2]=clamp255(v);d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  if(mode!=='threshold'){
    const copy=document.createElement('canvas');copy.width=out.width;copy.height=out.height;
    const c=copy.getContext('2d');c.filter='contrast(1.12) saturate(0)';c.drawImage(out,0,0);

  }

function rotateCanvas(source,degrees){
  if(!degrees)return source;
  const rad=degrees*Math.PI/180,cos=Math.abs(Math.cos(rad)),sin=Math.abs(Math.sin(rad));
  const out=document.createElement('canvas');out.width=Math.ceil(source.width*cos+source.height*sin);out.height=Math.ceil(source.width*sin+source.height*cos);

function normalizeVIN(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[IOQ]/g,m=>({I:'1',O:'0',Q:'0'}[m]))}
function validateKarmakData(data){
  const confidence={};
  confidence.ro=/^\d{4,10}$/.test(data.ro||'')?'high':data.ro?'low':'missing';
  confidence.unit=/^[A-Z0-9-]{2,20}$/i.test(data.unit||'')?'high':data.unit?'low':'missing';
  data.vin=normalizeVIN(data.vin);
  confidence.vin=data.vin.length===17?'high':data.vin?'low':'missing';
  confidence.year=/^(19|20)\d{2}$/.test(data.year||'')?'high':data.year?'low':'missing';
  confidence.customer=(data.customer||'').length>=4?'high':data.customer?'low':'missing';
  confidence.complaint=(data.complaint||'').length>=12?'high':data.complaint?'low':'missing';

function scoreKarmakData(data,raw,ocrConfidence=0){
  const c=validateKarmakData(data);let score=0;
  score+=c.ro==='high'?18:c.ro==='low'?5:0;
  score+=c.unit==='high'?12:c.unit==='low'?4:0;
  score+=c.vin==='high'?22:c.vin==='low'?4:0;
  score+=c.year==='high'?8:c.year==='low'?2:0;
  score+=c.customer==='high'?14:c.customer==='low'?3:0;
  score+=c.complaint==='high'?18:c.complaint==='low'?4:0;
  score+=Math.min(8,(raw||'').length/180);
  score+=Math.min(8,(Number(ocrConfidence)||0)/12.5);
  return{score,confidence:c};

function mergeKarmakData(candidates){
  const fields=['ro','unit','customer','year','makeModel','type','vin','date','createdBy','complaint'];const merged={};
  for(const f of fields){

    if(!options.length){merged[f]='';continue}
    options.sort((a,b)=>b.score-a.score||b.v.length-a.v.length);merged[f]=options[0].v;
  }
  validateKarmakData(merged);return merged;

function cleanFieldOCR(raw,label=''){

  if(label)v=v.replace(new RegExp(label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[:#-]?','i'),'').trim();
  return v.replace(/^[:#\-\s]+|[:#\-\s]+$/g,'').trim();

function footer(back=true,next='Continue',fn='nextStep()',disabled=false){return `<div class="footer-actions"><button class="btn" ${back?'':'disabled'} onclick="prevStep()">← Back</button><button class="btn primary" ${disabled?'disabled':''} onclick="${fn}">${next} →</button></div>`}
function locationStep(){const locations=[['Left Front','Near Kingpin'],['Right Front','Near Kingpin'],['Left Rear','Tandem End'],['Right Rear','Tandem End']];return `<div class="eyebrow">SECTION 1 OF 8</div><h2>Step 1: Select Repair Location</h2><p class="muted"><b>Front of the trailer is the KINGPIN end.</b> Select a wheel location or Center Module.</p><div class="simple-location-grid">${locations.map(([name,detail])=>`<button type="button" class="simple-location-btn ${state.draft.location===name?'selected':''}" onclick="setVal('location','${name}')"><strong>${name}</strong><small>${detail}</small></button>`).join('')}</div><div class="simple-location-center"><button type="button" class="simple-location-btn center-module-btn ${state.draft.location==='Center Module'?'selected':''}" onclick="setVal('location','Center Module')"><strong>Center Module</strong><small>Landing gear, air tank, ABS module/valve, level valve and center components</small></button></div>${state.draft.location?`<div class="notice"><b>Selected:</b> ${state.draft.location}</div>`:''}${footer(false,'Continue to System','nextStep()',!state.draft.location)}`}
function systemStep(){const systems=['Wheel End','Brakes','Suspension','Air System','Lighting','ABS','Electrical','Wheel & Tire','Slider / Bogie','Kingpin','Landing Gear'];return `<div class="eyebrow">SECTION 2 OF 8</div><h2>Select System</h2><p class="muted">Choose a system to narrow the repair options.</p><div class="option-grid">${systems.map(x=>`<div class="option ${state.draft.system===x?'selected':''}" onclick="setVal('system','${x}')"><h3>${x}</h3><small>${x==='Wheel End'?'Hub cap, wheel seal, hub assembly':x==='Brakes'?'Disc or drum brake repairs':x==='Suspension'?'Air ride, shocks, alignment and bogey':x==='Lighting'?'Single or multiple light repairs':x==='ABS'?'ABS light, fault code, sensor, wiring or valve':x==='Slider / Bogie'?'Slider box rebuild or replacement':x==='Landing Gear'?'Roadside leg, curbside leg, crank and braces':'Prototype placeholder'}</small></div>`).join('')}</div>${footer(true,'Select Component','nextStep()',!state.draft.system)}`}
function componentStep(){const d=state.draft;
if(d.system==='Brakes'&&!d.brakeType)return `<div class="eyebrow">SECTION 3 OF 8</div><h2>Brake Type</h2><div class="option-grid"><div class="option ${d.brakeType==='Disc'?'selected':''}" onclick="setVal('brakeType','Disc')"><h3>Disc</h3><small>Pads, rotor, caliper</small></div><div class="option ${d.brakeType==='Drum'?'selected':''}" onclick="setVal('brakeType','Drum')"><h3>Drum</h3><small>Shoes, drum, chamber, slack adjuster</small></div></div>${footer(true,'Select Component','render()',!d.brakeType)}`;
if(d.system==='Suspension'&&!d.suspensionGroup)return `<div class="eyebrow">SECTION 3 OF 8</div><h2>Suspension</h2><p class="muted">Most common repairs are listed first.</p><div class="list">${['Air Ride','Shock Absorber','Alignment','Bogey','Height Control Valve','Torque Arm','Suspension Bushings','Hanger / Bracket','Crossmember','Axle','Leaf Spring (Rare)'].map(x=>`<div class="row" onclick="selectSuspensionGroup('${x}')"><span><b>${x}</b></span><span>›</span></div>`).join('')}</div>${footer(true,'Select Component','render()',true)}`;
if(d.system==='Suspension'&&d.suspensionGroup==='Air Ride'&&!d.package){const opts=['Air Bag','Height Control Valve','Dump Valve','Air Lines / Fittings'];return `<div class="eyebrow">SECTION 3 OF 8</div><h2>Air Ride</h2><div class="list">${opts.map(x=>`<div class="row" onclick="setVal('package','${x}')"><span>${x}</span><span>›</span></div>`).join('')}</div>${footer(true,'Select Condition','nextStep()',true)}`}
let opts=[];
if(d.system==='Wheel End')opts=['Hub Cap','Wheel Seal','Hub Assembly','Advanced Repairs'];
else if(d.system==='Brakes'&&d.brakeType==='Disc')opts=['Brake Pads','Brake Rotor','Brake Caliper','Advanced Repairs'];
else if(d.system==='Brakes'&&d.brakeType==='Drum')opts=['Brake Shoes','Brake Drum','Brake Chamber','Slack Adjuster','Advanced Repairs'];
else if(d.system==='Suspension')opts=d.package?[d.package]:[];
else if(d.system==='Lighting')opts=['Single Light Repair','Install New Light','Multiple Lights Out','Entire Circuit Inoperative','Intermittent Lighting','Trailer Harness / Main Wiring'];
else if(d.system==='ABS')opts=['ABS Light On','ABS Light Does Not Work','Fault Code Present','Sensor / Tone Ring','Wiring / Power','ABS Modulator Valve'];
else if(d.system==='Electrical')opts=['Wiring / Connector','No Power','Poor Ground','Harness','Junction Box'];
else if(d.system==='Wheel & Tire')opts=['Tire','Wheel / Rim','Valve Stem','Inflation System','Wheel Stud / Lug Nut'];
else if(d.system==='Slider / Bogie')opts=['Slider Box Rebuild','Complete Slider Box Replacement','Slider Pins / Release','Other Slider Repair'];
else if(d.system==='Landing Gear')opts=['Roadside Leg','Curbside Leg','Cross Shaft','Crank Handle','Sand Shoe / Foot Plate','Leg Brace','Mounting Brackets','Cross Tube','K-Brace','Drive Shaft','Bushings','Pins / Roll Pins','Complete Landing Gear Assembly'];
else opts=['Inspection / Repair','Other'];
return `<div class="eyebrow">SECTION 3 OF 8</div><h2>Select Component</h2><p class="muted">${d.system}${d.brakeType?' – '+d.brakeType:''}${d.suspensionGroup?' – '+d.suspensionGroup:''}</p><div class="list">${opts.map(x=>`<div class="row ${d.package===x?'selected':''}" onclick="${x==='Brakes'?`routeToBrakes()`: `setVal('package','${x}')`}"><span>${x}</span><span>›</span></div>`).join('')}</div>${footer(true,'Select Condition','nextStep()',!d.package)}`}
function selectSuspensionGroup(x){state.draft.suspensionGroup=x;state.draft.suspensionType=x==='Air Ride'?'Air Ride':null;if(x!=='Air Ride')state.draft.package=x;save()}
function routeToBrakes(){state.draft.system='Brakes';state.draft.package=null;state.draft.brakeType=null;save()}
function conditionOptions(){const p=state.draft.package;if(p==='Hub Cap')return ['Leaking','Cracked','Cloudy','Loose','Inflation Port Damaged'];if(p==='Wheel Seal')return ['Leaking','Damaged'];if(p==='Hub Assembly')return ['Broken','Cracked','Non-Serviceable'];if(p==='Brake Rotor')return ['Worn','Cracked','Heat Checked','Failed Tone Ring'];if(p==='Brake Caliper')return ['Leaking','Seized','Damaged','Oversized Cross Bar Holes'];if(p==='Brake Pads'||p==='Brake Shoes')return ['Worn','Contaminated','Cracked'];if(p==='Brake Drum')return ['Worn','Cracked','Heat Checked'];if(p==='Air Bag')return ['Leaking','Broken','Weather Checked','Rubbing','Damaged'];if(p==='Height Control Valve')return ['Leaking','Failed','Out of Adjustment','Damaged'];if(p==='Air Lines / Fittings')return ['Leaking','Cracked','Rubbed Through','Loose'];if(p==='Shock Absorber')return ['Leaking','Broken','Loose','Worn'];if(p==='Alignment')return ['Out of Specification','Tire Wear','Trailer Pulling','Axle Shifted'];if(p==='Bogey')return ['Broken','Cracked','Bent','Worn','Corroded','Non-Serviceable'];if(['Torque Arm','Suspension Bushings','Hanger / Bracket','Crossmember','Axle','Leaf Spring (Rare)','Dump Valve'].includes(p))return ['Broken','Cracked','Worn','Loose','Bent','Leaking','Non-Serviceable'];if(['Single Light Repair','Install New Light','Multiple Lights Out','Entire Circuit Inoperative','Intermittent Lighting','Trailer Harness / Main Wiring'].includes(p))return ['Bad Bulb / LED','Corrosion','Broken Wire','Loose Connection','Damaged Connector','No Power','Poor Ground','Intermittent','Water Intrusion','Non-Serviceable'];if(['ABS Light On','ABS Light Does Not Work','Fault Code Present','Sensor / Tone Ring','Wiring / Power','ABS Modulator Valve'].includes(p))return ['Light Stays On','Light Does Not Work','Fault Code Present','Broken','Corroded','Open Circuit','Short Circuit','Leaking','Non-Serviceable'];if(['Slider Box Rebuild','Complete Slider Box Replacement','Slider Pins / Release','Other Slider Repair'].includes(p))return ['Damaged','Bent','Cracked','Seized','Non-Serviceable'];if(['Roadside Leg','Curbside Leg','Cross Shaft','Crank Handle','Sand Shoe / Foot Plate','Leg Brace','Mounting Brackets','Cross Tube','K-Brace','Drive Shaft','Bushings','Pins / Roll Pins','Complete Landing Gear Assembly'].includes(p))return ['Hard to Crank','Bent','Broken','Will Not Raise','Will Not Lower','Seized','Internal Failure','Weld Cracked','Excessive Play'];return ['Broken','Worn','Failed','Other']}
function conditionStep(){return `<div class="eyebrow">SECTION 4 OF 8</div><h2>Select Condition</h2><div class="list">${conditionOptions().map(x=>`<div class="row ${state.draft.condition===x?'selected':''}" onclick="setVal('condition','${x}')"><span>${x}</span><span>›</span></div>`).join('')}</div><div class="field" style="margin-top:14px"><label>Notes / details</label><textarea onchange="setVal('notes',this.value,false)" placeholder="Optional details">${state.draft.notes||''}</textarea></div>${footer(true,'Select Repair','nextStep()',!state.draft.condition)}`}
function repairOptions(){const p=state.draft.package;if(['Wheel Seal','Brake Rotor','Brake Caliper','Brake Pads','Brake Shoes','Brake Drum','Hub Assembly','Air Bag','Height Control Valve','Shock Absorber'].includes(p))return ['Replace'];if(p==='Air Lines / Fittings')return ['Repair','Replace'];if(p==='Alignment')return ['Inspect','Adjust','Align'];if(p==='Bogey')return ['Repair','Replace','Weld','Inspect'];if(['Torque Arm','Suspension Bushings','Hanger / Bracket','Crossmember','Axle','Leaf Spring (Rare)','Dump Valve'].includes(p))return ['Repair','Replace','Inspect'];if(['Single Light Repair','Multiple Lights Out','Entire Circuit Inoperative','Intermittent Lighting','Trailer Harness / Main Wiring'].includes(p))return ['Diagnose','Repair','Replace'];if(p==='Install New Light')return ['Install'];if(['ABS Light On','ABS Light Does Not Work','Fault Code Present','Sensor / Tone Ring','Wiring / Power','ABS Modulator Valve'].includes(p))return ['Diagnose','Repair','Replace','Inspect'];if(['Slider Box Rebuild'].includes(p))return ['Rebuild'];if(p==='Complete Slider Box Replacement')return ['Replace'];if(['Roadside Leg','Curbside Leg','Cross Shaft','Crank Handle','Sand Shoe / Foot Plate','Leg Brace','Mounting Brackets','Cross Tube','K-Brace','Drive Shaft','Bushings','Pins / Roll Pins','Complete Landing Gear Assembly'].includes(p))return ['Replace','Repair','Adjust','Lubricate','Weld','Inspect'];if(p==='Hub Cap')return ['Tighten','Replace','Reseal','Inspect'];return ['Repair','Replace','Inspect']}
function repairStep(){return `<div class="eyebrow">SECTION 5 OF 8</div><h2>Select Repair</h2><div class="list">${repairOptions().map(x=>`<div class="row ${state.draft.repair===x?'selected':''}" onclick="setVal('repair','${x}')"><span>${x}</span><span>›</span></div>`).join('')}</div>${footer(true,'Components Used','nextStep()',!state.draft.repair)}`}
function partsData(){const d=state.draft;let required=[],inspect=[];if(d.package==='Hub Cap'){required=d.repair==='Replace'?['Hub Cap','Hub Cap Gasket']:['Hub Cap Gasket'];inspect=['Fill Plug','Hub Vent']}if(d.package==='Wheel Seal'){required=['Wheel Seal','Hub Cap Gasket'];inspect=['Spindle Nut','Hub Assembly']}if(d.package==='Hub Assembly'){required=['Preloaded Hub Assembly'];inspect=['Spindle','Tone Ring']}if(d.package==='Brake Rotor'){required=['Brake Rotor','Rotor Mounting Bolts','Wheel Seal','Hub Cap Gasket'];inspect=['Brake Pads','Caliper']}if(d.package==='Brake Caliper'){required=['Brake Caliper','Caliper Mounting Bolts','Wheel Seal','Hub Cap Gasket'];inspect=['Brake Pads','Rotor']}if(d.package==='Brake Pads'){required=['Brake Pad Set'];inspect=['Rotor','Caliper']}if(d.package==='Brake Shoes'){required=['Brake Shoe Set'];inspect=['Brake Drum','Hardware']}if(d.package==='Air Bag'){required=['Air Bag','Air Bag Mounting Kit','Air Fitting'];inspect=['Air Line','Upper Mount','Lower Mount']}if(d.package==='Height Control Valve'){required=['Height Control Valve'];inspect=['Linkage Rod','Air Fittings','Air Lines']}if(d.package==='Air Lines / Fittings'){required=[d.repair==='Replace'?'Air Line / Fitting':'Repair Material'];inspect=['Adjacent Air Line','Protective Loom']}if(d.package==='Shock Absorber'){required=['Shock Absorber'];inspect=['Upper Mount','Lower Mount','Mounting Hardware']}if(d.package==='Alignment'){required=[];inspect=['Axle Position','Torque Arms','Suspension Bushings','Tires / Wheels']}if(d.package==='Bogey'){required=d.repair==='Replace'?['Bogey Assembly']:['Bogey Repair Materials'];inspect=['Slider Pins','Bushings','Crossmembers','Slider Rails','Mounting Hardware']}if(d.package==='Dump Valve'){required=['Dump Valve'];inspect=['Air Lines','Air Fittings','Electrical Solenoid','Pin Pull Bag Operation']}if(d.package==='Single Light Repair'){required=['Light / Bulb as Needed'];inspect=['Harness / Pigtail','Connector','Mounting Screws']}if(d.package==='Install New Light'){required=['Light','Wire Harness / Pigtail','Harness Connector','Mounting Screws'];inspect=['Primary Wire','Split Loom','Grommet']}if(['Multiple Lights Out','Entire Circuit Inoperative','Intermittent Lighting','Trailer Harness / Main Wiring'].includes(d.package)){required=['Diagnostic / Wiring Repair Materials'];inspect=['Lights','Harness','Connectors','Grounds']}if(d.package==='Fault Code Present'){required=[];inspect=['ABS Sensor','Tone Ring','Wiring','ABS Valve']}if(d.package==='Sensor / Tone Ring'){required=[];inspect=['ABS Sensor','Tone Ring','Sensor Holder','Wiring']}if(d.package==='ABS Modulator Valve'){required=['ABS Modulator Valve'];inspect=['Air Lines','Air Fittings','Electrical Connector','Mounting Hardware']}if(d.package==='Slider Box Rebuild'){required=['Slider Box Repair Materials'];inspect=['Slider Pins','Bushings','Springs','Air Cylinder','Cross Shaft','Slider Rails']}if(d.package==='Complete Slider Box Replacement'){required=['Complete Slider Box'];inspect=['Crossmembers','Slider Rails','Frame','Alignment']}if(['Roadside Leg','Curbside Leg'].includes(d.package)){required=d.repair==='Replace'?[d.package]:[];inspect=['Cross Shaft','Crank Handle','Sand Shoe / Foot Plate','Leg Brace','Mounting Brackets','K-Brace']}if(d.package==='Cross Shaft'){required=d.repair==='Replace'?['Cross Shaft']:[];inspect=['Roadside Leg','Curbside Leg','Drive Shaft','Pins / Roll Pins']}if(d.package==='Crank Handle'){required=d.repair==='Replace'?['Crank Handle']:[];inspect=['Crank Holder','Mounting Hardware','Drive Shaft']}if(d.package==='Sand Shoe / Foot Plate'){required=d.repair==='Replace'?['Sand Shoe / Foot Plate']:[];inspect=['Leg Tube','Pins / Roll Pins','Weld Area']}if(['Leg Brace','Mounting Brackets','Cross Tube','K-Brace'].includes(d.package)){required=d.repair==='Replace'?[d.package]:[];inspect=['Weld Area','Mounting Hardware','Roadside Leg','Curbside Leg']}if(d.package==='Drive Shaft'){required=d.repair==='Replace'?['Drive Shaft']:[];inspect=['Cross Shaft','Bushings','Pins / Roll Pins']}if(d.package==='Bushings'){required=d.repair==='Replace'?['Landing Gear Bushings']:[];inspect=['Drive Shaft','Cross Shaft','Pins / Roll Pins']}if(d.package==='Pins / Roll Pins'){required=d.repair==='Replace'?['Pins / Roll Pins']:[];inspect=['Cross Shaft','Drive Shaft','Crank Handle']}if(d.package==='Complete Landing Gear Assembly'){required=d.repair==='Replace'?['Complete Landing Gear Assembly']:[];inspect=['Mounting Brackets','Cross Shaft','Crank Handle','Leg Braces','K-Brace']}return {required,inspect}}
function partsStep(){const pd=partsData();const lighting=state.draft.system==='Lighting';const absFault=state.draft.package==='Fault Code Present';return `<div class="eyebrow">SECTION 6 OF 8</div><h2>Components Used</h2><p class="muted">Verify standard parts. Add inspection items only when used.</p>${absFault?`<div class="section-title">ABS SYSTEM TYPE</div><div class="option-grid">${['WABCO','Haldex','Bendix'].map(x=>`<div class="option ${state.draft.absBrand===x?'selected':''}" onclick="setVal('absBrand','${x}')"><h3>${x}</h3></div>`).join('')}</div><div class="field"><label>Fault Code</label><input value="${state.draft.faultCode||''}" ${state.draft.faultUnavailable?'disabled':''} onchange="setVal('faultCode',this.value,false)"><label style="margin-top:8px"><input type="checkbox" ${state.draft.faultUnavailable?'checked':''} onchange="setVal('faultUnavailable',this.checked)"> Not Available</label></div>`:''}<div class="section-title">STANDARD PARTS</div>${pd.required.length?pd.required.map(x=>`<div class="checkrow"><span>${x}</span><input type="checkbox" checked onchange="togglePart('${x}',this.checked)"></div>`).join(''):'<p class="muted">No automatic part required for diagnosis.</p>'}${(pd.required.includes('Wheel Seal')||state.draft.package==='Hub Cap')?`<div class="section-title">LUBRICANT</div><div class="option-grid"><div class="option ${state.draft.lubricant==='80W-90'?'selected':''}" onclick="setVal('lubricant','80W-90')"><h3>80W-90</h3></div><div class="option ${state.draft.lubricant==='EBL Grease'?'selected':''}" onclick="setVal('lubricant','EBL Grease')"><h3>EBL Grease</h3></div></div>`:''}<div class="section-title">INSPECT & ADD IF NEEDED</div>${pd.inspect.map(x=>`<div class="checkrow"><span>${x}</span><input type="checkbox" ${state.draft.parts[x]?'checked':''} onchange="togglePart('${x}',this.checked)"></div>`).join('')}${lighting?commonLightingSupplies():`<div class="section-title">ZIP TIES</div><div class="grid cols-2"><div class="field"><label>Large</label><select onchange="setVal('zipLarge',this.value,false)">${zipOptions()}</select></div><div class="field"><label>Small</label><select onchange="setVal('zipSmall',this.value,false)">${zipOptions()}</select></div></div>`}${repairScopeEditor()}${additionalPartsEditor()}${footer(true,isEstimateMode()?'Review Estimate':'Repair Verification','nextStep()',((pd.required.includes('Wheel Seal')||state.draft.package==='Hub Cap')&&!state.draft.lubricant)||(absFault&&!state.draft.absBrand))}`}
function commonLightingSupplies(){return `<div class="section-title">COMMON SHOP SUPPLIES</div><div class="supply-grid">${[['Butt Connectors','butt'],['Zip Ties','zip'],['Heat Shrink','heat'],['Ring Terminals','ring']].map(([label,key])=>`<div class="supply-box"><h4>${label}</h4><div class="grid cols-2"><div class="field"><label>Small</label><select onchange="setVal('${key}Small',this.value,false)">${zipOptions()}</select></div><div class="field"><label>Large</label><select onchange="setVal('${key}Large',this.value,false)">${zipOptions()}</select></div></div></div>`).join('')}<div class="supply-box"><h4>Primary Wire</h4><select onchange="setVal('wireGauge',this.value,false)"><option>None</option><option>16 Gauge</option><option>14 Gauge</option><option>12 Gauge</option></select></div><div class="supply-box"><h4>Split Loom</h4><select onchange="setVal('loomSize',this.value,false)"><option>None</option><option>1/4 inch</option><option>3/8 inch</option><option>1/2 inch</option></select></div></div>`}
function zipOptions(){return [0,1,2,3,4,5,10,15,20].map(x=>`<option>${x}</option>`).join('')}
function verificationItems(){const p=state.draft.package;let a=[];if(p==='Hub Cap')a=['Hub cap installed and secured','Hub cap gasket replaced','Fill plug installed','Hub vent clear','Lubricant level correct','No leaks'];if(p==='Wheel Seal')a=['Wheel seal installed correctly','Bearing adjustment completed','Brakes adjusted','Hub rotates freely','Lubricant level correct','No leaks'];if(p==='Hub Assembly')a=['Preloaded hub installed','Hub rotates freely','Lubricant added','Spindle inspected','Tone ring verified','Wheel torque completed','No leaks'];if(p==='Brake Rotor')a=['New rotor installed','New rotor mounting bolts installed','Blue Loctite applied','Rotor bolts torqued','Wheel seal replaced','Hub cap gasket replaced','Brakes adjusted','No leaks'];if(p==='Brake Caliper')a=['New caliper installed','New caliper mounting bolts installed','Blue Loctite applied','Caliper bolts torqued','Brake operation verified','No leaks'];if(p==='Brake Pads'||p==='Brake Shoes')a=['New set installed','Related hardware inspected','Brake operation verified'];if(p==='Air Bag')a=['Air bag installed correctly','Mounting hardware secured','Air fitting verified','No air leaks','Suspension raises and lowers correctly'];if(p==='Height Control Valve')a=['Valve installed correctly','No air leaks','Linkage secured','Ride height known','Ride height set from axle center to top of air bag','Suspension operation verified'];if(p==='Air Lines / Fittings')a=['Repair secured','No air leaks','Line routed away from rubbing','Suspension operation verified'];if(p==='Shock Absorber')a=['Shock installed correctly','Upper and lower mounts secured','No interference','Suspension operation verified'];if(p==='Alignment')a=['Alignment measurements recorded','Axles adjusted to specification','Fasteners secured','Tracking verified'];if(p==='Bogey')a=['Bogey structure repaired or replaced','Mounting hardware secured','Welds inspected','Alignment verified','Suspension operation verified'];if(p==='Dump Valve')a=['Dump valve operates correctly','Pin pull bag operation verified','Suspension inflates correctly','No air leaks'];if(['Single Light Repair','Install New Light','Multiple Lights Out','Entire Circuit Inoperative','Intermittent Lighting','Trailer Harness / Main Wiring'].includes(p))a=['All affected lights operate','Mounting secure','Wiring and grounds verified','Wiring protected','No exposed wiring'];if(['ABS Light On','ABS Light Does Not Work','Fault Code Present','Sensor / Tone Ring','Wiring / Power','ABS Modulator Valve'].includes(p))a=['ABS light operation verified','Fault documented or marked Not Available','Sensor / tone ring inspected','Wiring secured','No active fault remains'];if(p==='Slider Box Rebuild')a=['Slider box structure repaired','Pins engage and release','Air cylinder operation verified','Welds inspected','Slider moves correctly'];if(p==='Complete Slider Box Replacement')a=['Replacement box installed','Box weld completed','Welds inspected','Slider pins engage','Alignment verified'];if(['Roadside Leg','Curbside Leg','Cross Shaft','Crank Handle','Sand Shoe / Foot Plate','Leg Brace','Mounting Brackets','Cross Tube','K-Brace','Drive Shaft','Bushings','Pins / Roll Pins','Complete Landing Gear Assembly'].includes(p))a=['Landing gear raises smoothly','Landing gear lowers smoothly','Roadside and curbside legs remain synchronized','Crank operates and stores correctly','Mounting and braces are secure','Two-speed operation verified when equipped'];return a}
function verifyStep(){
 const items=verificationItems();
 if(!state.draft.verificationNotes)state.draft.verificationNotes={};
 const incomplete=items.some(x=>!['pass','fail','na'].includes(normalizeVerify(state.draft.verification[x])));
 const failedWithoutNote=items.some(x=>normalizeVerify(state.draft.verification[x])==='fail'&&!(state.draft.verificationNotes[x]||'').trim());
 return `<div class="eyebrow">SECTION 7 OF 8</div><h2>Repair Verification</h2><p class="muted">Select Pass, Fail, or N/A for every item. Failed items require a note.</p><div class="verifyhead"><span>Verification Item</span><span style="text-align:center">Pass</span><span style="text-align:center">Fail</span><span style="text-align:center">N/A</span></div>${items.map((x,i)=>{const v=normalizeVerify(state.draft.verification[x]);const key='verify_'+i;return `<div class="verifyrow"><div class="verifyline"><span>${x}</span><label class="verifychoice"><input type="radio" name="${key}" value="pass" ${v==='pass'?'checked':''} onchange="setVerify('${escapeAttr(x)}','pass')"></label><label class="verifychoice"><input type="radio" name="${key}" value="fail" ${v==='fail'?'checked':''} onchange="setVerify('${escapeAttr(x)}','fail')"></label><label class="verifychoice"><input type="radio" name="${key}" value="na" ${v==='na'?'checked':''} onchange="setVerify('${escapeAttr(x)}','na')"></label></div>${v==='fail'?`<div class="failnote"><label class="required">Failure note required</label><textarea placeholder="Briefly explain why this item failed" oninput="setVerifyNote('${escapeAttr(x)}',this.value)">${state.draft.verificationNotes[x]||''}</textarea></div>`:''}</div>`}).join('')}<div class="notice">All items must have a response before continuing. N/A is acceptable when the verification does not apply to this repair.</div>${footer(true,'Review & Finish','nextStep()',incomplete||failedWithoutNote)}`
}
function normalizeVerify(v){if(v===true)return 'pass';if(v===false||v==null)return '';return v}
function escapeAttr(x){return String(x).replace(/'/g,"\\'")}
function additionalPartsEditor(){
 const items=state.draft.additionalParts||[];

function addAdditionalPart(){

function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function repairScopeEditor(){
 const p=state.draft.package;
 if(!['Hub Cap','Air Bag'].includes(p))return '';
 const current=state.draft.repairScope||'Single';
 let options=[];
 if(p==='Hub Cap')options=[['Single','Single hub cap',1],['Front Axle','Front axle – 2 hub caps',2],['Rear Axle','Rear axle – 2 hub caps',2],['All 4','All 4 hub caps',4],['All 6','All 6 hub caps',6],['Custom','Custom quantity',Number(state.draft.scopeQty)||1]];
 if(p==='Air Bag')options=[['Single','Single air bag',1],['Front Axle','Front axle air bags – 2',2],['Rear Axle','Rear axle air bags – 2',2],['All Suspension Bags','All suspension air bags – 4',4],['Custom','Custom quantity',Number(state.draft.scopeQty)||1]];
 const custom=current==='Custom'?`<div class="field" style="margin-top:10px"><label>Custom quantity</label><input type="number" min="1" step="1" value="${Number(state.draft.scopeQty)||1}" onchange="setScopeQty(this.value)"></div>`:'';
 return `<div class="section-title">REPAIR SCOPE</div><div class="option-grid">${options.map(([value,label,qty])=>`<div class="option ${current===value?'selected':''}" onclick="setRepairScope('${value}',${qty})"><h3>${label}</h3></div>`).join('')}</div>${custom}<div class="notice"><b>Quantity applied:</b> ${scopeQuantity(state.draft)}. Labor and automatic parts will be multiplied by this quantity.</div>`;
}
function setRepairScope(scope,qty){state.draft.repairScope=scope;state.draft.scopeQty=Math.max(1,Number(qty)||1);save()}
function setScopeQty(qty){state.draft.scopeQty=Math.max(1,Number(qty)||1);save()}
function scopeQuantity(r){if(!['Hub Cap','Air Bag'].includes(r.package))return 1;return Math.max(1,Number(r.scopeQty)||1)}
function scopeLabel(r){const q=scopeQuantity(r);return r.repairScope&&r.repairScope!=='Single'?`${r.repairScope} (${q})`:`Single (${q})`}
function finishStep(){const techSelect=state.user.role==='manager'?`<div class="field" style="margin-top:14px"><label>Tech responsible for this repair <span class="required">!</span></label><select onchange="setVal('techNo',this.value,false)"><option value="">Select Tech #</option>${TECHS.filter(t=>t.role!=='manager').map(t=>`<option value="${t.id}" ${state.draft.techNo===t.id?'selected':''}>Tech ${t.id} – ${t.name}</option>`).join('')}</select><small class="muted">Internal only. This Tech # will not appear in the Karmak Cause or Correction.</small></div>`:'';return `<div class="eyebrow">${isEstimateMode()?'SECTION 7 OF 7':'SECTION 8 OF 8'}</div><h2>Review & Finish</h2>${summary()}${state.draft.package==='Install New Light'?`<div class="field"><label>Number of lights installed</label><input type="number" min="1" value="${state.draft.lightCount||1}" onchange="setVal('lightCount',this.value,false)"></div>`:''}${state.draft.package==='Complete Slider Box Replacement'&&state.user.role==='manager'?`<div class="field"><label>Additional box weld hours</label><input type="number" step="0.5" min="0" value="${state.draft.weldHours||0}" onchange="setVal('weldHours',this.value,false)"><small class="muted">Base replacement labor is 24.0 hours plus box weld.</small></div>`:''}${techSelect}${state.user.role==='manager'?`<div class="notice" style="margin-top:14px"><b>Component labor:</b> ${state.draft.package?laborHours(state.draft).toFixed(1):'0.0'} hr &nbsp; · &nbsp; <b>Saved estimate total:</b> ${(state.job?.repairs||[]).reduce((s,r)=>s+laborHours(r),0).toFixed(1)} hr</div>`:''}<div class="footer-actions"><button class="btn" onclick="prevStep()">← Back</button><div class="toolbar" style="flex-wrap:wrap;justify-content:flex-end"><button class="btn" onclick="saveDraftOnly()">Save Draft</button>${state.draft.jobType==='Estimate'||state.user.role==='manager'?`<button class="btn primary" ${state.user.role==='manager'&&!state.draft.techNo?'disabled':''} onclick="addComponentToEstimate()">+ Add Component to Estimate</button>`:''}<button class="btn warn" ${state.user.role==='manager'&&!state.draft.techNo?'disabled':''} onclick="finishJob('estimate')">Finish Estimate</button><button class="btn success" ${state.user.role==='manager'&&!state.draft.techNo?'disabled':''} onclick="finishJob('repair')">Finish Repair</button></div></div>`}
function summary(){const d=state.draft;return `<div class="summaryline"><span>Location</span><b>${d.location||'—'}</b></div><div class="summaryline"><span>System</span><b>${d.system||'—'}</b></div>${d.brakeType?`<div class="summaryline"><span>Brake Type</span><b>${d.brakeType}</b></div>`:''}${d.suspensionGroup?`<div class="summaryline"><span>Suspension Menu</span><b>${d.suspensionGroup}</b></div>`:''}<div class="summaryline"><span>Component</span><b>${d.package||'—'}</b></div>${['Hub Cap','Air Bag'].includes(d.package)?`<div class="summaryline"><span>Repair Scope</span><b>${scopeLabel(d)}</b></div>`:''}<div class="summaryline"><span>Condition</span><b>${d.condition||'—'}</b></div><div class="summaryline"><span>Repair</span><b>${d.repair||'—'}</b></div>`}
function setVal(k,v,rer=true){if(k==='package'&&state.draft.package!==v){state.draft.repairScope='Single';state.draft.scopeQty=1}state.draft[k]=v;if(rer)save();else localStorage.setItem('jk_proto_state',JSON.stringify(state))}
function togglePart(x,v){state.draft.parts[x]=v;save()}
function setVerify(x,v){state.draft.verification[x]=v;if(v!=='fail'&&state.draft.verificationNotes)delete state.draft.verificationNotes[x];save()}
function setVerifyNote(x,v){if(!state.draft.verificationNotes)state.draft.verificationNotes={};state.draft.verificationNotes[x]=v;localStorage.setItem('jk_proto_state',JSON.stringify(state));const items=verificationItems();const ready=!items.some(i=>!['pass','fail','na'].includes(normalizeVerify(state.draft.verification[i])))&&!items.some(i=>normalizeVerify(state.draft.verification[i])==='fail'&&!(state.draft.verificationNotes[i]||'').trim());const b=document.querySelector('.footer-actions .btn.primary');if(b)b.disabled=!ready}
function nextStep(){if(isEstimateMode()&&state.step===6){state.step=8}else{state.step=Math.min(8,state.step+1)}save()}
function prevStep(){if(isEstimateMode()&&state.step===8){state.step=6}else{state.step=Math.max(1,state.step-1)}save()}
function addAnother(){
  if(!state.job)return alert('Open or create an estimate first.');
  const keepType=state.draft.jobType||state.job.stage||'Estimate';
  const keepTech=state.draft.techNo||state.job.owner||'';
  const hasStarted=Boolean(state.draft.location||state.draft.system||state.draft.package||state.draft.condition||state.draft.repair);
  if(hasStarted){
    const missing=[];
    if(!state.draft.location)missing.push('location');
    if(!state.draft.system)missing.push('system');
    if(!state.draft.package)missing.push('component');
    if(!state.draft.condition)missing.push('condition');
    if(!state.draft.repair)missing.push('repair action');
    if(missing.length)return alert('Finish the current component before adding another. Missing: '+missing.join(', ')+'.');
    commitRepair();
  }
  resetDraft();
  state.draft.jobType=keepType;
  state.draft.techNo=state.user.role==='manager'?keepTech:state.user.id;
  state.step=2;
  state.screen='workflow';
  save();
}
function addComponentToEstimate(){if(!state.draft.package)return alert('Select a component before adding it to the estimate.');if(state.user.role==='manager'&&!state.draft.techNo)return alert('Select the Tech # responsible for this component.');commitRepair();const keepTech=state.draft.techNo||state.job?.owner||'';resetDraft();state.draft.jobType='Estimate';state.draft.techNo=keepTech;state.job.stage='Estimate';state.job.status='Estimate In Progress';saveJobs(jobs().map(j=>j.id===state.job.id?state.job:j));state.step=2;save()}
function removeEstimateComponent(i){if(!state.job?.repairs?.[i])return;if(!confirm('Remove this component from the estimate?'))return;state.job.repairs.splice(i,1);saveJobs(jobs().map(j=>j.id===state.job.id?state.job:j));save()}
function foundSeparateIssue(){if(state.draft.package){state.draft.separateIssue=true;commitRepair()}const jt=state.draft.jobType||state.job.stage||'Estimate';resetDraft();state.draft.jobType='Estimate';state.draft.separateIssue=true;state.job.status='Waiting Manager Review';state.step=2;save()}
function commitRepair(){const repair=JSON.parse(JSON.stringify(state.draft));repair.techNo=state.user.role==='manager'?(state.draft.techNo||state.job.owner||''):state.user.id;repair.enteredBy=state.user.id;repair.completedAt=new Date().toISOString();state.job.repairs.push(repair);let arr=jobs();arr=arr.map(j=>j.id===state.job.id?state.job:j);saveJobs(arr)}
function saveDraftOnly(){if(state.draft.package)commitRepair();state.job.status='Estimate In Progress';let arr=jobs().map(j=>j.id===state.job.id?state.job:j);saveJobs(arr);state.screen='dashboard';save()}
function finishJob(type){if(state.draft.package)commitRepair();state.job.stage=type==='estimate'?'Estimate':'Repair';state.job.status=type==='estimate'?'Waiting Approval':'Completed';if(type!=='estimate')recordCompletedLearning(state.job);let arr=jobs().map(j=>j.id===state.job.id?state.job:j);saveJobs(arr);state.screen=state.user?.role==='manager'?'manager':'dashboard';save()}
function fallbackLaborHours(r){if(r.package==='Wheel Seal')return r.brakeType==='Disc'?3:2;if(r.package==='Brake Rotor')return 1.5;if(r.package==='Hub Cap')return .5*scopeQuantity(r);if(r.package==='Brake Caliper')return 1.5;if(r.package==='Brake Pads')return 1.5;if(r.package==='Hub Assembly')return 3;if(r.package==='Air Bag')return 1.1*scopeQuantity(r);if(r.package==='Height Control Valve')return 1.5;if(r.package==='Air Lines / Fittings')return 1;if(r.package==='Shock Absorber')return 1;if(r.package==='Alignment')return 1.5;if(r.package==='Bogey')return r.repair==='Replace'?24:12;if(r.package==='Dump Valve')return 1.5;if(r.package==='Install New Light')return .75*(Number(r.lightCount)||1);if(r.package==='Multiple Lights Out'||r.package==='Entire Circuit Inoperative'||r.package==='Trailer Harness / Main Wiring')return 3;if(r.package==='Slider Box Rebuild')return 18;if(r.package==='Complete Slider Box Replacement')return 24+(Number(r.weldHours)||0);return 1}
function laborHours(r){if(Number(r.estimateUsed)>0)return Number(r.estimateUsed);const s=srtHours(r);if(Number(s)>0)return s*scopeQuantity(r);return fallbackLaborHours(r)}
function causeText(repairs){return repairs.map(r=>`${(r.location||'location').toLowerCase()} ${(r.package||'repair').toLowerCase()} ${(r.condition||'issue').toLowerCase()}.`).join(' ')}
function correctionText(repairs){return repairs.map(r=>{if(r.package==='Brake Rotor')return `Replaced ${r.location.toLowerCase()} brake rotor, installed new mounting bolts with blue Loctite, completed wheel-end service, and verified brake operation.`;if(r.package==='Hub Cap')return `${r.repair}d ${scopeQuantity(r)} hub cap${scopeQuantity(r)>1?'s':''} (${scopeLabel(r)}), installed matching gasket${scopeQuantity(r)>1?'s':''}, verified hub vents and lubricant level, and checked for leaks.`;if(r.package==='Wheel Seal')return `Replaced ${r.location.toLowerCase()} wheel seal and hub cap gasket, adjusted bearings and brakes, added ${r.lubricant||'lubricant'}, and verified no leaks.`;if(r.package==='Air Bag')return `Replaced ${scopeQuantity(r)} air bag${scopeQuantity(r)>1?'s':''} (${scopeLabel(r)}), installed mounting kit${scopeQuantity(r)>1?'s':''} and air fitting${scopeQuantity(r)>1?'s':''}, and verified no air leaks and proper suspension operation.`;return `${r.repair}d ${r.location.toLowerCase()} ${r.package.toLowerCase()} and verified proper operation.`}).join(' ')}
function industryHours(r){const copy={...r,estimateUsed:null};return laborHours(copy)}
function laborKey(r){return [r.system,r.brakeType||'',r.package,r.repair].join('|')}
function laborHistory(){return JSON.parse(localStorage.getItem('jk_labor_history')||'{}')}
function jkAverage(r){const vals=laborHistory()[laborKey(r)]||[];return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:industryHours(r)}
function laborSamples(r){return (laborHistory()[laborKey(r)]||[]).length}
function saveActualHours(i){const input=document.getElementById('actual-'+i);const v=Number(input.value);if(!v||v<=0)return alert('Enter the Karmak hours used.');const j=state.job||jobs()[0];const reps=j.repairs.length?j.repairs:[];const r=reps[i];if(!r)return alert('Save a real repair before recording labor history.');const h=laborHistory(),k=laborKey(r);h[k]=h[k]||[];h[k].push(v);localStorage.setItem('jk_labor_history',JSON.stringify(h));r.actualKarmakHours=v;let arr=jobs().map(x=>x.id===j.id?j:x);saveJobs(arr);render()}
function setEstimateUsed(i,v){const j=state.job||jobs()[0];if(!j.repairs[i])return;const n=Number(v);j.repairs[i].estimateUsed=n>0?n:null;saveJobs(jobs().map(x=>x.id===j.id?j:x));render()}
function consolidatedParts(reps){const counts={};reps.forEach(r=>{partsDataFor(r).filter(Boolean).forEach(p=>counts[p]=(counts[p]||0)+1);(r.additionalParts||[]).forEach(x=>{const name=(x.name||'').trim();if(name)counts[name]=(counts[name]||0)+(Number(x.qty)||1)})});return Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0]))}

function promptConvertEstimate(){

function confirmConvertEstimate(){
 const pin=document.getElementById('convertpin')?.value||'';
 const allowed=TECHS.find(t=>t.id===state.user?.id&&t.pin===pin);
 if(!allowed){alert('Code does not match the logged-in user.');return}

 const j=state.job||jobs()[0];const reps=j.repairs.length?j.repairs:[{location:'Right Rear',system:'Brakes',brakeType:'Disc',package:'Brake Rotor',condition:'Worn',repair:'Replace',lubricant:'80W-90',parts:{},techNo:'394'},{location:'Left Front',system:'Wheel End',package:'Hub Cap',condition:'Cracked',repair:'Replace',lubricant:'80W-90',parts:{},techNo:'8'}];const hrs=reps.reduce((s,r)=>s+laborHours(r),0);const rate=119,labor=hrs*rate,supplies=labor*.13,epa=6,total=labor+supplies+epa;const cause=causeText(reps),correction=correctionText(reps);const parts=consolidatedParts(reps);return `<div class="manager-grid"><div><div class="card"><h2>Estimate Review</h2><table class="table"><thead><tr><th>#</th><th>Location</th><th>System / Repair</th><th>Tech #</th><th>Description</th><th>Hours Used</th><th></th></tr></thead><tbody>${reps.map((r,i)=>`<tr><td>${i+1}</td><td>${r.location}</td><td><b>${r.system}${r.brakeType?' – '+r.brakeType:''}</b><br>${r.package} ${r.repair}${['Hub Cap','Air Bag'].includes(r.package)?`<br><small>Scope: ${scopeLabel(r)}</small>`:''}</td><td><span class="techstamp">${r.techNo||'—'}</span></td><td>${r.condition}; ${r.repair.toLowerCase()} ${r.package.toLowerCase()}.</td><td><b>${laborHours(r).toFixed(1)} hr</b></td><td>${j.repairs.length?`<button class="btn danger" onclick="removeEstimateComponent(${i})">Remove</button>`:''}</td></tr>`).join('')}</tbody></table><div class="toolbar" style="margin-top:10px;flex-wrap:wrap"><button class="btn primary" onclick="managerAddRepair()">+ Add Component to Estimate</button><button class="btn" onclick="managerNewEstimate()">Create New Estimate</button><button class="btn" onclick="createFromPhoto()">📷 Create from Photo</button><button class="btn" onclick="openROPhotos()">📷 RO Photos</button></div></div><div class="card copybox"><div class="toolbar" style="justify-content:space-between"><h3>CAUSE <small>(Copy to Karmak)</small></h3><button class="btn" onclick="copyText('cause')">Copy</button></div><textarea id="cause">${cause}</textarea></div><div class="card copybox"><div class="toolbar" style="justify-content:space-between"><h3>CORRECTION <small>(Copy to Karmak)</small></h3><button class="btn" onclick="copyText('correction')">Copy</button></div><textarea id="correction">${correction}</textarea></div></div><div class="grid"><div class="card"><h3>Labor Intelligence <small>(Manager Only)</small></h3><div class="manager-only-note">Industry line, JK average, estimate used, and actual Karmak hours never appear on technician screens.</div><div class="notice"><b>LABOR RATE: $119.00 / HR</b><div style="margin-top:10px"><label><b>SRT time basis:</b></label> <select onchange="setSrtMode(this.value)"><option value="average" ${srtMode()==='average'?'selected':''}>Average</option><option value="goal" ${srtMode()==='goal'?'selected':''}>Goal</option></select></div></div>${reps.map((r,i)=>{const samples=laborSamples(r),avg=jkAverage(r),conf=samples<10?'Learning':samples<25?'Developing':samples<50?'Established':'High Confidence';const se=srtEntryFor(r),si=srtIndexFor(r);return `<div class="labor-intel"><div class="li-row"><span><b>${r.package}</b><br><small>${r.location}</small></span><span></span></div><div class="li-row"><span>SRT matched line<br><small>${se?se.description:'No automatic match'}</small></span><b>${se?`${se.goal??'—'} goal<br>${se.average??'—'} avg`:'—'}</b></div><div class="li-row"><label>SRT override</label><select onchange="setSrtOverride(${i},this.value)"><option value="">Automatic match</option>${SRT_LIBRARY.map((x,n)=>`<option value="${n}" ${si===n?'selected':''}>${x.description} — G ${x.goal??'—'} / A ${x.average??'—'}</option>`).join('')}</select></div><div class="li-row"><span>Time generated from SRT</span><b>${srtHours(r)!=null?srtHours(r).toFixed(2)+' hr':'Fallback'}</b></div><div class="li-row"><span>Industry line</span><b>${industryHours(r).toFixed(1)} hr</b></div><div class="li-row"><span>JK average<br><span class="confidence">${conf} · ${samples} example(s)</span></span><b>${avg.toFixed(1)} hr</b></div><div class="li-row"><label for="used-${i}">Estimate used</label><input id="used-${i}" type="number" step="0.25" min="0" value="${laborHours(r)}" onchange="setEstimateUsed(${i},this.value)"></div>${j.repairs.length?`<div class="li-row"><label for="actual-${i}">Actual Karmak hours</label><span><input id="actual-${i}" type="number" step="0.25" min="0" value="${r.actualKarmakHours||''}"><button class="btn" style="margin-top:6px;width:100%" onclick="saveActualHours(${i})">Add to JK Average</button></span></div>`:''}</div>`}).join('')}<div class="summaryline"><span>Estimated Total Labor Hours</span><b>${hrs.toFixed(1)}</b></div><div class="summaryline"><span>Estimated Labor Amount</span><b>$${labor.toFixed(2)}</b></div></div><div class="card"><h3>Automated Parts Pull List <small>(No Part Numbers or Pricing)</small></h3><ul class="parts-pull">${parts.map(([p,q])=>`<li><span>${p}</span><b>${q}</b></li>`).join('')}</ul></div><div class="card"><h3>Shop Learning – Note Suggestions</h3><p class="muted">Repeated completed-repair notes are collected here. Approving one adds it as a shortcut button.</p>${Object.entries(noteLearning()).filter(([k,v])=>v.count>=2&&!ignoredSuggestions().includes(k)).sort((a,b)=>b[1].count-a[1].count).slice(0,8).map(([k,v])=>`<div class="learning-card"><div class="toolbar" style="justify-content:space-between"><b>${v.label}</b><span class="count">${v.count} notes</span></div><small>${Object.keys(v.techs||{}).length} technician(s)</small><div class="toolbar" style="margin-top:8px"><button class="btn primary" onclick='approveSuggestion(${JSON.stringify(k)})'>Approve as Button</button><button class="btn" onclick='ignoreSuggestion(${JSON.stringify(k)})'>Ignore</button></div></div>`).join('')||'<div class="muted">No repeated note suggestions yet. Complete repairs with notes to begin learning.</div>'}</div><div class="card"><h3>Standards Applied</h3><div>✓ Cross-system required parts</div><div>✓ Tech # retained internally</div><div>✓ Karmak Cause and Correction kept clean</div></div></div></div><div class="pricebar"><div class="pricebox">Labor Hours<strong>${hrs.toFixed(1)}</strong></div><div class="pricebox">Labor Amount<strong>$${labor.toFixed(2)}</strong></div><div class="pricebox">Shop Supplies 13%<strong>$${supplies.toFixed(2)}</strong></div><div class="pricebox">EPA Fee<strong>$6.00</strong></div><div class="pricebox" style="background:#062b5c;color:white">Estimate Total<strong>$${total.toFixed(2)}</strong></div></div><div class="footer-actions"><button class="btn" onclick="go('dashboard')">Save as Draft</button><div class="toolbar"><button class="btn primary" onclick="promptConvertEstimate()">Convert Estimate to RO</button><button class="btn success">Approve Estimate & Send to Customer →</button></div></div>`}
function partsDataFor(r){if(r.package==='Brake Rotor')return ['Brake Rotor','Rotor Mounting Bolts','Wheel Seal','Hub Cap Gasket',r.lubricant||'80W-90 or EBL'];if(r.package==='Hub Cap'){const q=scopeQuantity(r);return Array(q).fill('Hub Cap').concat(Array(q).fill('Hub Cap Gasket'),[r.lubricant||'80W-90 or EBL']);}if(r.package==='Wheel Seal')return ['Wheel Seal','Hub Cap Gasket',r.lubricant||'80W-90 or EBL'];if(r.package==='Brake Caliper')return ['Brake Caliper','Caliper Mounting Bolts','Blue Loctite','Wheel Seal','Hub Cap Gasket',r.lubricant||'80W-90 or EBL'];if(r.package==='Air Bag'){const q=scopeQuantity(r);return Array(q).fill('Air Bag').concat(Array(q).fill('Air Bag Mounting Kit'),Array(q).fill('Air Fitting'));}if(r.package==='Height Control Valve')return ['Height Control Valve'];if(r.package==='Air Lines / Fittings')return ['Air Line / Fitting'];if(r.package==='Shock Absorber')return ['Shock Absorber'];if(r.package==='Alignment')return ['Alignment Service'];if(r.package==='Bogey')return r.repair==='Replace'?['Bogey Assembly','Mounting Hardware']:['Bogey Repair Materials'];if(r.package==='Dump Valve')return ['Dump Valve'];if(r.package==='Install New Light')return ['Light','Wire Harness / Pigtail','Harness Connector','Mounting Screws'];if(['Multiple Lights Out','Entire Circuit Inoperative','Intermittent Lighting','Trailer Harness / Main Wiring'].includes(r.package))return ['Wiring Repair Materials','Butt Connectors','Zip Ties','Heat Shrink'];if(r.package==='Slider Box Rebuild')return ['Slider Box Repair Materials'];if(r.package==='Complete Slider Box Replacement')return ['Complete Slider Box','Box Weld'];if(['Roadside Leg','Curbside Leg','Cross Shaft','Crank Handle','Sand Shoe / Foot Plate','Leg Brace','Mounting Brackets','Cross Tube','K-Brace','Drive Shaft','Bushings','Pins / Roll Pins','Complete Landing Gear Assembly'].includes(r.package))return [r.package];return [r.package]}
function copyText(id){const el=document.getElementById(id);el.select();navigator.clipboard.writeText(el.value);alert(id.toUpperCase()+' copied')}
load();
</script>
